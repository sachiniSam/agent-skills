# Task quality — one scenario per SDK row in references/sdk-integration.md,
# plus the RBAC, agent-identity and MCP tracks.
#
# The skill is conversation-gated (Gate 2 asks, then waits), so each prompt
# carries the answers the skill would ask for and approves the plan up front.
# The stub `asg` on PATH returns realistic IDs; assert/asg-checks.js inspects
# the commands run and the files written. One rubric covers the holistic call.
#
# Fixture apps live under fixtures/workspace/apps/<name>. `npm run reset`
# restores them after a run.

# ---------------------------------------------------------------- Track A ---

- description: "A/React (Vite): spa app, @asgardeo/react wired with real clientId + baseUrl"
  vars:
    request: >-
      My React app (Vite) is at ./apps/react-vite. Set up Asgardeo login for it:
      register what's needed and wire sign-in/sign-out into the code.
      Decisions, so you don't need to ask: call the app "orders-web", the dev URL is
      http://localhost:5173, there's no deployed URL yet, and no backend reads the
      tokens. I approve the plan in advance — go end to end, including a test user.
      Don't run npm install; just add the dependency to package.json.
    expect: { appDir: apps/react-vite, appType: spa, package: "@asgardeo/react", redirect: "http://localhost:5173" }
    checks: [statusFirst, noLogin, appCreated, clientIdWired, baseUrlWired, packageAdded, testUserCreated, noSecretLeak, consoleLink, noDelete]
  assert:
    - type: skill-used
      value: asgardeo
    - type: javascript
      value: file://assert/asg-checks.js
    - type: llm-rubric
      value: >-
        PASS only if ALL hold: (1) an AsgardeoProvider (from @asgardeo/react) wraps
        the app with clientId and baseUrl taken from the CLI output, not placeholders;
        (2) sign-in and sign-out controls are present (SignInButton/SignOutButton or
        useAsgardeo); (3) the UI does not show the signed-out branch while the SDK is
        still loading (uses <Loading>, isLoading or isInitialized); (4) the reply
        tells the user how to try signing in and gives the test user's credentials
        once; (5) the reply offers role-based gating as a next step or otherwise
        ends with what to do next.
      threshold: 0.7

