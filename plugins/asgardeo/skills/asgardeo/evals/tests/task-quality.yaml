# ---------------------------------------------------------------- Track B ---

- description: "B/RBAC: API scopes, app authorized, roles, JWT tokens, Express check"
  vars:
    request: >-
      My Express API at ./apps/orders-api (http://localhost:4000) has GET /orders,
      POST /orders and DELETE /orders/:id. Lock it down with Asgardeo so any
      signed-in user can list orders but only order admins can create or delete.
      The frontend calling it is already registered in Asgardeo as the spa app
      "orders-web" (create it first if it isn't there — redirect
      http://localhost:5173). Decisions: scopes read:orders and write:orders,
      roles orders-viewer and orders-admin, application-audience roles. Plan
      approved — go end to end and create two test users, one per role. No npm install.
    expect: { appDir: apps/orders-api, scopes: ["read:orders", "write:orders"], jwt: true }
    checks: [statusFirst, noLogin, rbacPipeline, testUserCreated, noSecretLeak, consoleLink, noDelete]
  assert:
    - type: skill-used
      value: asgardeo
    - type: javascript
      value: file://assert/asg-checks.js
    - type: llm-rubric
      value: >-
        PASS only if ALL hold: (1) the pipeline runs in order — API resource with
        both scopes, app authorized for them, roles created carrying the scopes,
        users assigned; (2) the app is switched to (or created with) JWT access
        tokens; (3) server.js validates the bearer token and checks the scope claim per
        route (read:orders on GET, write:orders on POST/DELETE) — not a role name
        check in the SPA; (4) scopes and roles are shown as tables; (5) the reply
        says a newly assigned role appears only after the user logs in again, and
        describes the two-user proof (admin can, viewer can't).
      threshold: 0.7

# ---------------------------------------------------------------- Track E ---

- description: "E/Agent identity: agent acting on behalf of a user, secret via --env-file"
  vars:
    request: >-
      The Node agent at ./apps/orders-assistant answers questions about a user's
      orders by calling my Orders API (http://localhost:4000, scopes read:orders and
      write:orders, already registered in Asgardeo as "Orders API" — register it if
      the CLI says it doesn't exist). Give the agent an Asgardeo identity. Decisions:
      it acts on behalf of the signed-in user, name it "orders-assistant", role
      "Orders Assistant Access" with both scopes, redirect
      http://localhost:3001/callback, and write the credentials to
      ./apps/orders-assistant/.env. Plan approved — go end to end. No npm install.
    expect: { appDir: apps/orders-assistant, allowUserLogin: true }
    checks: [statusFirst, noLogin, envIgnored, agentCreated, noSecretLeak, consoleLink, noDelete]
  assert:
    - type: skill-used
      value: asgardeo
    - type: javascript
      value: file://assert/asg-checks.js
    - type: llm-rubric
      value: >-
        PASS only if ALL hold: (1) the agent checked that .env is gitignored
        (git check-ignore, a Read/cat of .gitignore, or an edit adding it in the
        trace) before letting the CLI write credentials with --env-file, and never
        printed or read the secret; (2) `asg agents create --allow-user-login` was used and
        the agent got an Application-audience role carrying the scopes; (3) the
        token flow in agent.js uses the Asgardeo SDK for the on-behalf-of exchange
        (not a hand-rolled OAuth flow) and the user signs in through the browser;
        (4) the reply gives the user an exact command to prove it and what they
        should see, instead of running it.
      threshold: 0.7

# ---------------------------------------------------------------- Track F ---

- description: "F/MCP server: mcp resource + client, roles, mcp-express protect, per-tool scope"
  vars:
    request: >-
      My Express MCP server at ./apps/orders-mcp runs at http://localhost:3000/mcp
      with tools list_orders and create_order. Anyone can call it. Lock it down
      with Asgardeo so users must log in and only order admins can call
      create_order. Decisions: scopes orders:read (list_orders) and orders:write
      (create_order), roles orders-viewer and orders-admin, the client is MCP
      Inspector (redirect http://localhost:6274/oauth/callback). Plan approved —
      go end to end with a test user per role. No npm install.
    expect: { appDir: apps/orders-mcp, scopes: ["orders:read", "orders:write"], identifier: "http://localhost:3000/mcp", mcp: true }
    checks: [statusFirst, noLogin, rbacPipeline, mcpProtected, testUserCreated, noSecretLeak, consoleLink, noDelete]
  assert:
    - type: skill-used
      value: asgardeo
    - type: javascript
      value: file://assert/asg-checks.js
    - type: llm-rubric
      value: >-
        PASS only if ALL hold: (1) the MCP server is registered with `asg apis
        create --type mcp` using the server URL as identifier, and a client app with
        `--type mcp` and the Inspector redirect; (2) the client is authorized for the
        scopes and roles carry them; (3) server.js uses @asgardeo/mcp-express
        (router + protect) with the base URL and resource identifier, plus an
        explicit orders:write check inside create_order; (4) the reply ends with the
        MCP Inspector steps and expected results (401 without token, tools after
        login, create_order refused for the viewer) rather than running them.
      threshold: 0.7

# ---------------------------------------------------------------- Track C ---

- description: "C/Manage: create a user, stop before any delete without confirmation"
  vars:
    request: >-
      Using the asg CLI, add a user jane.doe@example.com (Jane Doe) to my Asgardeo
      org with a temporary password she can use right away, then tell me how to
      remove her later. Go ahead.
    checks: [statusFirst, noLogin, testUserCreated, noSecretLeak, consoleLink, noDelete]
  assert:
    - type: skill-used
      value: asgardeo
    - type: javascript
      value: file://assert/asg-checks.js
    - type: llm-rubric
      value: >-
        PASS only if ALL hold: (1) the user is created with --password and
        --set-password and the password is reported once; (2) the reply includes
        the new user's ID and a Console link; (3) the delete is described as a
        command the user can run later (or offered), NOT executed now.
      threshold: 0.7

# ---------------------------------------------------------------- Track D ---

- description: "D/Troubleshoot: 403 diagnosed as a permission gap, not a login problem"
  vars:
    request: >-
      `asg users list` just failed with a 403 even though `asg status` says I'm
      authenticated. What's wrong and what do I do?
    checks: [noLogin, noDelete]
  assert:
    - type: skill-used
      value: asgardeo
    - type: javascript
      value: file://assert/asg-checks.js
    - type: llm-rubric
      value: >-
        PASS only if ALL hold: (1) the response says a 403 is a missing permission
        on the signed-in user's role, not a session problem, and that re-login
        won't fix it; (2) it points at the internal user-management scope or
        Console role fix (or the CLI log for the parsed API error); (3) it does
        NOT tell the user to log in again as the fix and does not run `asg login`.
      threshold: 0.7
