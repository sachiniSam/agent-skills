      Add Asgardeo login to the Spring Boot app at ./apps/spring-boot. Decisions:
      name "orders-spring", it runs at http://localhost:8080, no production URL.
      Plan approved — go end to end with a test user. Don't run Maven.
    expect: { appDir: apps/spring-boot, appType: oidc, redirect: "http://localhost:8080" }
    checks: [statusFirst, noLogin, appCreated, clientIdWired, baseUrlWired, testUserCreated, noSecretLeak, consoleLink, noDelete]
  assert:
    - type: skill-used
      value: asgardeo
    - type: javascript
      value: file://assert/asg-checks.js
    - type: llm-rubric
