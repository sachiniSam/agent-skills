      Add Asgardeo login to my Next.js app at ./apps/nextjs (App Router).
      Decisions: name it "orders-portal", dev URL http://localhost:3000, no
      production URL yet. I approve the plan — go ahead end to end with a test user.
      Don't run npm install; add the dependency to package.json.
    expect: { appDir: apps/nextjs, appType: oidc, package: "@asgardeo/nextjs", redirect: "http://localhost:3000" }
    checks: [statusFirst, noLogin, appCreated, clientIdWired, baseUrlWired, packageAdded, testUserCreated, noSecretLeak, consoleLink, noDelete]
  assert:
    - type: skill-used
      value: asgardeo
    - type: javascript
      value: file://assert/asg-checks.js
    - type: llm-rubric
      value: >-
        PASS only if ALL hold: (1) the app is registered as a confidential OIDC app
        and the Next.js SDK is wired (provider/middleware per the Asgardeo Next.js
        quickstart) with the real clientId and baseUrl; (2) the client secret is
        NOT printed, guessed or asked for in chat — the user is told to read it from
        the Console (asg apps settings / Console link) and put it in an env file;
        (3) sign-in and sign-out are reachable from the UI; (4) the reply explains
        how to verify login with the test user.
      threshold: 0.7

